name: Backend checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q -m "not integration"
