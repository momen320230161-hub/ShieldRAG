name: Frontend checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build with synthetic public configuration
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://frontend-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_only
          VITE_API_BASE_URL: /api/v1
          BACKEND_PROXY_TARGET: http://proxy-canary.invalid:9100
          VITE_SUPABASE_SECRET_KEY: shieldrag-private-ci-canary
          GEMINI_API_KEY: shieldrag-private-ci-canary
      - run: npm run check:bundle
      - name: Reject an accidental private key in the public field
        run: |
          npm run build
          npm run check:bundle
        env:
          VITE_SUPABASE_URL: https://frontend-ci.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_secret_shieldrag-private-ci-canary
